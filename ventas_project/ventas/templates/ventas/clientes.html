{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Lista de Clientes</h2>

    <div class="mb-3">
        <a href="{% url 'cliente_nuevo' %}" class="btn btn-success">Agregar Cliente Nuevo</a>
        <a href="{% url 'home' %}" class="btn btn-secondary">Volver</a>  <!-- Botón volver -->
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Email</th>
                
                <th>Editar</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.telefono }}</td>
                <td>{{ cliente.email }}</td>
                
                <td><a href="{% url 'cliente_editar' cliente.pk %}" class="btn btn-primary btn-sm">Editar</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No hay clientes.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
