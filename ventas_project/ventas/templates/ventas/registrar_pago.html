{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Registrar Pago - {{ cliente.nombre }}</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label>Monto</label>
            <input type="number" name="monto" step="0.01" min="0" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Guardar Pago</button>
        <a href="{% url 'cuentas_corrientes' cliente.id %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
