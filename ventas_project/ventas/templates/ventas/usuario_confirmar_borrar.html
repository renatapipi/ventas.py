{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h3>¿Desea eliminar al usuario "{{ usuario.username }}"?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'usuarios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
