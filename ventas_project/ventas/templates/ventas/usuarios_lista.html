<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Email</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    {% for usuario in usuarios %}
    <tr>
        <td>{{ usuario.id }}</td>
        <td>{{ usuario.username }}</td>
        <td>{{ usuario.email }}</td>
        <td>
            {% if usuario.is_active %}
                ✅ Activo
            {% else %}
                ❌ Inactivo
            {% endif %}
        </td>
        <td>
            <form action="{% url 'usuario_toggle' usuario.id %}" method="post" style="display:inline;">
                {% csrf_token %}
                {% if usuario.is_active %}
                    <button type="submit" style="background:red; color:white; padding:5px; border:none; border-radius:5px;">
                        Desactivar
                    </button>
                {% else %}
                    <button type="submit" style="background:green; color:white; padding:5px; border:none; border-radius:5px;">
                        Activar
                    </button>
                {% endif %}
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
